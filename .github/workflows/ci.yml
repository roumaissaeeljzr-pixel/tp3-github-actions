
name: CI - Tests Python

on:
  push:
  workflow_dispatch:


jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Executer les tests et mesurer la couverture
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=99

