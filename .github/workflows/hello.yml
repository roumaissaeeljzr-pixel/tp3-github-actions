
name: Premier workflow CI

on:
  push:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Afficher un message
        run: echo "Hello from GitHub Actions"

      - name: Informations du runner
        run: |
          python --version
          pwd
          ls -la

      - name: Informations Git
        run: |
          echo "Branche : $GITHUB_REF_NAME"
          echo "Commit : $GITHUB_SHA"
          echo "Événement : $GITHUB_EVENT_NAME"
          
      - name: Simuler une erreur
        run: exit 1

      - name: Etape apres erreur
        run: echo "Cette étape ne sera pas exécutée"